<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nudge">
  <title>Nudge · 轻推</title>
  <defs>
    <linearGradient id="nudge-mark-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#141821"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.25" fill="none" stroke="url(#nudge-mark-gradient)" stroke-width="1.5" opacity="0.85"/>
  <!--
    Canonical product mark, 24-unit geometry, painted in the brand gradient here
    and in `currentColor` by `NudgeMark` (src/client/ui/icons.ts). Keep the two
    in sync: test/brand-icon.test.mjs asserts the geometry is identical.
  -->
  <g id="nudge-mark" transform="translate(8.5 8.2) scale(2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="3" width="12" height="9" rx="2.3" stroke="url(#nudge-mark-gradient)" stroke-width="1.8"/>
    <path d="M6 6.4h3.2M6 8.4h2" stroke="#8b93a7" stroke-width="1.6"/>
    <circle cx="16.2" cy="16" r="3.5" stroke="url(#nudge-mark-gradient)" stroke-width="2"/>
    <path d="M18.8 18.6 21 20.8" stroke="url(#nudge-mark-gradient)" stroke-width="2.2"/>
  </g>
</svg>
